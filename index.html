<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCEA Thindigua &mdash; Groups &amp; Membership MIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3D; --brass:#A6813C; --wine:#6E2C3B; --forest:#3B5245;
    --paper:#F6F4EF; --charcoal:#2B2B28; --rule:rgba(27,42,61,0.18); --rule-light:rgba(27,42,61,0.10);
    --font-sans:'Inter',system-ui,-apple-system,sans-serif;
    --font-serif:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);}
  h1,h2,h3{font-family:var(--font-serif);color:var(--ink);margin:0;font-weight:600;}
  a{color:inherit;}
  button{font-family:var(--font-sans);cursor:pointer;}
  input,select,textarea{font-family:var(--font-sans);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}
  .rule{border-top:1px solid var(--rule);}
  .btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;font-size:13.5px;border-radius:4px;transition:transform 0.12s ease,box-shadow 0.12s ease,opacity 0.12s ease;}
  .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(27,42,61,0.25);}
  .btn:active:not(:disabled){transform:translateY(0);box-shadow:none;}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-ghost{border:1px solid var(--rule);background:transparent;color:var(--charcoal);padding:8px 14px;font-size:13.5px;border-radius:4px;transition:background 0.12s ease,border-color 0.12s ease,transform 0.12s ease;}
  .btn-ghost:hover:not(:disabled){background:rgba(27,42,61,0.05);border-color:var(--charcoal);}
  .btn-danger{border:1px solid var(--wine);background:transparent;color:var(--wine);padding:7px 12px;font-size:12.5px;border-radius:4px;transition:background 0.12s ease;}
  .btn-danger:hover:not(:disabled){background:rgba(110,44,59,0.08);}
  .field-label{display:block;font-size:12px;color:var(--charcoal);opacity:0.65;margin-bottom:4px;letter-spacing:0.01em;}
  .field-input{width:100%;border:none;border-bottom:1px solid var(--rule);background:transparent;font-size:14.5px;padding:6px 2px;color:var(--charcoal);outline:none;}
  .field-input:focus{border-bottom-color:var(--brass);}
  /* Number fields (Service Book amounts, attendance, etc.) stay freely
     typable instead of nudging toward the browser's up/down spin
     buttons — the buttons are hidden but the field is still a real
     number input underneath (numeric keyboard on mobile, valueAsNumber
     in code), just without the counter UI. */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .field-err{color:var(--wine);font-size:11.5px;margin-top:3px;}
  table{border-collapse:collapse;width:100%;}
  th{text-align:left;font-size:11.5px;text-transform:none;color:var(--charcoal);opacity:0.6;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--rule);background:rgba(27,42,61,0.025);white-space:nowrap;}
  td{padding:10px 10px;font-size:13.5px;border-bottom:1px solid var(--rule-light);vertical-align:top;}
  tbody tr{transition:background 0.1s ease;}
  tbody tr:hover{background:rgba(27,42,61,0.028);}
  .table-wrap{border:1px solid var(--rule);border-radius:7px;}
  .table-wrap table{border-radius:7px;}
  .table-wrap th:first-child{border-radius:7px 0 0 0;}
  .table-wrap th:last-child{border-radius:0 7px 0 0;}
  .table-wrap tr:last-child td{border-bottom:none;}
  .chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--rule);margin:2px 4px 2px 0;cursor:pointer;background:#fff;transition:background 0.12s ease,border-color 0.12s ease;}
  .chip:hover{background:var(--paper);border-color:var(--charcoal);}
  .badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;color:#fff;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(27,42,61,0.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(2px);animation:fadeIn 0.16s ease;}
  .modal{background:var(--paper);border-radius:9px;padding:28px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px rgba(15,20,30,0.35);animation:modalIn 0.18s cubic-bezier(0.16,1,0.3,1);}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .banner{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--brass);padding:10px 14px;font-size:12.5px;color:var(--charcoal);border-radius:5px;margin-bottom:18px;box-shadow:0 1px 3px rgba(15,20,30,0.04);}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:6px;font-size:13px;z-index:500;box-shadow:0 12px 30px rgba(15,20,30,0.35);animation:toastIn 0.2s cubic-bezier(0.16,1,0.3,1);}
  .card{background:#fff;border:1px solid var(--rule);border-radius:7px;padding:18px;box-shadow:0 1px 2px rgba(15,20,30,0.03),0 1px 12px rgba(15,20,30,0.035);transition:box-shadow 0.15s ease,transform 0.15s ease;}
  .card[onclick]{cursor:pointer;}
  .card[onclick]:hover{box-shadow:0 4px 8px rgba(15,20,30,0.05),0 8px 24px rgba(15,20,30,0.08);transform:translateY(-2px);}
  .nav-link{transition:background 0.12s ease,padding-left 0.12s ease;}
  .nav-link:hover{background:rgba(27,42,61,0.05) !important;padding-left:12px;}
  /* A thin top-of-screen progress bar that lights up for the duration of
     any save/delete/fetch — gives every action in the app instant visual
     feedback without every individual button needing its own spinner. */
  #busyBar{position:fixed;top:0;left:0;height:3px;width:0;z-index:9999;background:linear-gradient(90deg,var(--brass),#d4af6a,var(--brass));opacity:0;pointer-events:none;transition:opacity 0.2s ease;background-size:200% 100%;}
  body.app-busy #busyBar{opacity:1;width:100%;animation:busyShimmer 1.1s ease-in-out infinite;}
  @keyframes busyShimmer{0%{background-position:0% 0;}100%{background-position:200% 0;}}
  .stat-num{font-family:var(--font-serif);font-size:30px;color:var(--ink);}
  #app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .app-aside{border-right:1px solid var(--rule);padding:32px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);}
  .app-main{overflow-y:auto;height:100vh;padding:40px 48px;}
  .mobile-topbar{display:none;}
  .nav-backdrop{display:none;}
  /* Table wrappers scroll horizontally instead of breaking the page
     layout — several tables in this app (Service Book, obligations,
     the membership register) have more columns than a phone screen
     can show at once. */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  @media (max-width:820px){
    #app{grid-template-columns:1fr;}
    .mobile-topbar{
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:120;height:56px;flex-shrink:0;
      background:var(--paper);border-bottom:1px solid var(--rule);padding:0 16px;
    }
    .mobile-topbar-title{font-family:var(--font-serif);font-size:17px;font-weight:600;}
    .mobile-menu-btn{background:none;border:1px solid var(--rule);border-radius:4px;padding:7px 10px;font-size:16px;line-height:1;color:var(--ink);}
    .app-aside{
      position:fixed;top:0;left:0;bottom:0;width:82%;max-width:320px;height:100%;
      z-index:150;transform:translateX(-105%);transition:transform 0.22s ease;
      box-shadow:0 0 40px rgba(0,0,0,0.2);
    }
    .app-aside.nav-open{transform:translateX(0);}
    .nav-backdrop.nav-open{
      display:block;position:fixed;inset:0;background:rgba(27,42,61,0.4);z-index:140;
    }
    .app-main{height:auto;min-height:calc(100vh - 56px);padding:20px 16px 48px;}
    .modal{padding:18px;max-height:92vh;}
    .modal-backdrop{padding:10px;align-items:flex-start;padding-top:5vh;}
    h1{font-size:22px !important;}
    .card{padding:14px;}
    /* Any text/select/date input under 16px triggers iOS Safari's
       automatic zoom-in on focus, which then has to be manually pinched
       back out — this affects every form field in every module, so it's
       fixed once here rather than per field. */
    .field-input, input, select, textarea{font-size:16px;}
    /* The tiny per-row Edit/Remove/Reset buttons throughout the data
       tables are fine to keep visually compact (these tables already
       scroll horizontally on mobile), but they still need a real tap
       target — this pads the hit area without changing how big the
       button looks. */
    .btn-ghost, .btn-danger, .btn{min-height:34px;}
    table .btn-ghost, table .btn-danger{padding:6px 10px;}
    .officials-grid{grid-template-columns:1fr !important;}
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px;}

  /* -----------------------------------------------------------------
     LANDING SCREEN — the first thing anyone sees: a fresh install
     (Create a passcode) or a returning visit (Enter passcode). Built
     from the same design tokens as the rest of the app (--ink/--brass/
     --paper/--font-serif) so it reads as one product, not a bolted-on
     marketing page. The hero graphic and emblem below are original
     inline SVG, not a photograph — this is a self-contained file with
     no image hosting, and nothing here claims to depict a real building.
  ----------------------------------------------------------------- */
  .landing-shell{grid-column:1/-1;width:100%;max-width:1440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,0.08);}
  .landing-header{display:flex;align-items:center;gap:14px;padding:10px 40px;border-bottom:1px solid var(--rule);background:#fff;}
  .landing-emblem{flex-shrink:0;}
  .landing-brand-name{font-family:var(--font-serif);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:0.01em;}
  .landing-brand-sub{font-size:11.5px;color:var(--charcoal);opacity:0.6;}
  .landing-header-divider{width:1px;align-self:stretch;background:var(--rule);margin:2px 4px;}
  .landing-system-name{font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--ink);}
  .landing-hero{flex:1;display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:stretch;background-image:linear-gradient(90deg, rgba(15,24,36,0.94) 0%, rgba(15,24,36,0.82) 32%, rgba(15,24,36,0.38) 62%, rgba(15,24,36,0.12) 100%), url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAOEBkADASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAABQECAwQGBwAICf/EAFMQAAIBAwIDBQQJAQUGBQECDwECAwAEEQUSITFBBhMiUWEUMnGBByNCUpGhscHRYhUzcuHwJENTgpKiCBaywvE0Y3PSJUSD4hdUZJM1GCY2dKP/xAAcAQACAwEBAQEAAAAAAAAAAAACAwABBAUGBwj/xAA7EQACAQMDAgQEBAYCAgMAAwEAAQIDESEEEjEFQRMiUWEycaHwFIGRsQYjQsHR4TNSFfEkQ2IWNIJE/9oADAMBAAIRAxEAPwDgOoPb2ZcReKQ8jzxU+m6XJJajZC7u/FsKaGPHFsYNKD/UB1rZab2nB06GBApnRdrNIcCsCkoK5jjTi1aTCWjrcDRzDexGMx7k8XVfP8KyaQWncOzTK8e7arpW1TVFHZyfUJFieSI4KqcqeNYftLd2d0kb6eUSHO54kG0hqqUnJpR7mittcYpDb6W3ijVO6IQdOeaWWeO1sQYzsDDIqtoyLdwMqM0jL9huNXo9AvdVhaUo0JDbVEnAEU6KfDOetPKcttmZyT6xtyTkk/epLkouzvUVzjic4rfaR2NtLdkkvGNwynJTkp9KL6j2e0O8XP8AZSQv5wSstOTXqdFaWfJzaJo7NFdvqw/ugeImrM9yrwbriPvBjgD4TWobslZzzlQt1N4Nka7vc9aswfRdrTWxMUiSRcxHNwaq/DubujNVo7FdvJzywkmaZ3hVcJx2k9Kj1hJzNHI64WQeEA54VqL/ALGazp5Ytp1wB95V3D8RUI0a8WzS8u4wojJUqwO4D72DUlFwd2gYzvK8QL/Z8j6eofG8cV9PSqFutxCGkRtgXgcnnRq6mZ2KRvMyD   .landing-hero-left{position:relative;z-index:1;color:#fff;display:flex;flex-direction:column;justify-content:center;max-width:560px;}
  .landing-eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:0.14em;color:var(--brass);font-weight:600;margin-bottom:10px;}
  .landing-eyebrow::before{content:'';width:24px;height:2px;background:var(--brass);display:inline-block;}
  .landing-hero-left h1{color:#fff;font-size:28px;line-height:1.14;margin-bottom:10px;}
  .landing-hero-left p{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,0.82);margin-bottom:0;max-width:440px;}
  .landing-card-wrap{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;}
  .landing-card{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,0.28);}
  .landing-card h2{font-size:18px;margin-bottom:3px;}
  .landing-card > p.landing-card-sub{font-size:12px;color:var(--charcoal);opacity:0.65;margin:0 0 12px;line-height:1.4;}
  .landing-field{margin-bottom:9px;}
  .landing-field-input-row{display:flex;align-items:center;gap:9px;border:1px solid var(--rule);border-radius:5px;padding:7px 11px;background:var(--paper);}
  .landing-field-input-row:focus-within{border-color:var(--brass);}
  .landing-field-input-row svg{color:var(--charcoal);opacity:0.55;flex-shrink:0;}
  .landing-field-input-row input{border:none;background:transparent;outline:none;flex:1;min-width:0;font-size:13.5px;color:var(--ink);font-family:var(--font-sans);}
  .landing-field-toggle{background:none;border:none;padding:2px;color:var(--charcoal);opacity:0.5;flex-shrink:0;}
  .landing-field-row{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:12px;}
  .landing-checkbox{display:flex;align-items:center;gap:7px;color:var(--charcoal);opacity:0.8;cursor:pointer;}
  .landing-checkbox input{margin:0;accent-color:var(--brass);}
  .landing-btn{width:100%;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:5px;padding:9px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform 0.12s ease,box-shadow 0.12s ease;cursor:pointer;}
  .landing-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(27,42,61,0.3);}
  .landing-btn:active{transform:translateY(0);box-shadow:none;}
  .landing-btn-ghost{width:100%;background:transparent;color:var(--charcoal);border:1px solid var(--rule);border-radius:5px;padding:9px 18px;font-size:13px;margin-top:8px;transition:background 0.12s ease;cursor:pointer;}
  .landing-btn-ghost:hover{background:rgba(27,42,61,0.05);}
  .landing-link{color:var(--brass);font-size:12.5px;text-decoration:none;font-weight:600;transition:opacity 0.12s ease;}
  .landing-link:hover{opacity:0.7;text-decoration:underline;}
  .landing-modules{padding:14px 40px;background:var(--paper);}
  .landing-modules-grid{display:flex;flex-wrap:nowrap;gap:16px;overflow-x:auto;padding-bottom:4px;}
  .module-card{background:transparent;padding:0;flex:1 1 0;min-width:104px;transition:transform 0.15s ease;}
  .module-card:hover{transform:translateY(-3px);}
  .module-card:hover .module-card-icon{transform:scale(1.06);}
  .module-card-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;transition:transform 0.15s ease;}
  .module-card h3{font-size:12.5px;margin-bottom:3px;}
  .module-card p{font-size:10.5px;color:var(--charcoal);opacity:0.65;line-height:1.3;margin:0;}
  /* Category tints for the module showcase — muted, editorial swatches
     that extend the app's existing navy/brass/wine/forest tokens rather
     than a raw rainbow. */
  .mc-navy{background:rgba(37,64,168,0.16);color:#2540A8;}
  .mc-brass{background:rgba(217,151,20,0.20);color:#C9860F;}
  .mc-forest{background:rgba(22,163,74,0.16);color:#15803D;}
  .mc-wine{background:rgba(220,38,38,0.15);color:#DC2626;}
  .mc-plum{background:rgba(124,58,237,0.16);color:#7C3AED;}
  .mc-teal{background:rgba(13,148,136,0.17);color:#0D9488;}
  .mc-blue{background:rgba(29,143,224,0.17);color:#1D8FE0;}
  .landing-identity{padding:14px 40px;background:#fff;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
  .landing-identity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1100px;margin:0 auto;}
  .identity-card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;transition:box-shadow 0.15s ease,transform 0.15s ease;}
  .identity-card:hover{box-shadow:0 6px 18px rgba(15,20,30,0.06);transform:translateY(-2px);}
  .identity-card-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .identity-card h3{font-size:13px;margin-bottom:3px;}
  .identity-card p{font-size:11px;line-height:1.35;color:var(--charcoal);opacity:0.8;margin:0;}
  .identity-card ul{margin:0;padding:0;list-style:none;}
  .identity-card li{font-size:11px;line-height:1.3;color:var(--charcoal);opacity:0.85;display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
  .identity-card li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--brass);flex-shrink:0;transform:translateY(-1px);}
  .identity-card li:last-child{margin-bottom:0;}
  @media (max-width:860px){
    .landing-identity{padding:36px 20px;}
    .landing-identity-grid{grid-template-columns:1fr;}
  }
  .landing-footer{background:var(--ink);color:#fff;padding:16px 40px;display:flex;align-items:center;justify-content:center;}
  .landing-footer-verse{text-align:center;font-size:11.5px;line-height:1.5;color:rgba(255,255,255,0.85);max-width:1180px;font-style:italic;}
  .landing-footer-verse cite{display:block;margin-top:5px;color:var(--brass);font-style:normal;font-size:10.5px;letter-spacing:0.04em;}
  @media (max-width:860px){
    .landing-header{padding:14px 20px;flex-wrap:wrap;}
    .landing-header-divider{display:none;}
    .landing-hero{grid-template-columns:1fr;padding:40px 20px;}
    .landing-hero-left h1{font-size:30px;}
    .landing-card-wrap{padding-top:8px;}
    .landing-modules{padding:36px 20px;}
    .landing-footer{flex-direction:column;text-align:center;padding:24px 20px;}
    .landing-field-input-row input{font-size:16px;}
  }
</style>
</head>

function landingEmblem(){
  // The real PCEA crest (the user's own asset, embedded so this stays a
  // single standalone file).
  return `<img src="${PCEA_LOGO_DATA_URI}" alt="PCEA crest" style="height:62px;width:auto;display:block;">`;
}


const MODULE_SHOWCASE = [
  {icon:'people', color:'navy', name:'Members & Households', desc:'Manage the church family and their details.'},
  {icon:'groups', color:'brass', name:'Groups & Districts', desc:'Build and nurture small groups and districts.'},
  {icon:'personCheck', color:'forest', name:'Visitors', desc:'Capture and follow up with new visitors and guests.'},
  {icon:'book', color:'blue', name:'Service Book & Attendance', desc:'Track services, attendance and giving.'},
  {icon:'heartHand', color:'wine', name:'Pastoral Care', desc:'Support, visit and follow up on needs.'},
  {icon:'calendar', color:'navy', name:'Events & Calendar', desc:'Manage church events, meetings and activities.'},
  {icon:'coins', color:'brass', name:'Finances', desc:'Record offerings, manage funds and view reports.'},
  {icon:'chat', color:'plum', name:'Communication', desc:'Reach your church family effectively.'},
  {icon:'chartDoc', color:'teal', name:'Reports & Insights', desc:'Make informed decisions with real data.'},
  {icon:'shield', color:'navy', name:'Users & Security', desc:'Control access and keep your data safe.'}
];


function landingPasswordField(id, label, onEnter, opts){
  const o = opts||{};
  return `
    <div class="landing-field">
      ${o.hideLabel ? '' : `<label class="field-label">${esc(label)}</label>`}
      <div class="landing-field-input-row">
        ${icon('lock',17)}
        <input id="${id}" type="password" placeholder="${esc(o.placeholder||label)}" ${onEnter?`onkeydown="if(event.key==='Enter'){${onEnter}}"`:''}>
        <button type="button" class="landing-field-toggle" aria-label="Show or hide" onclick="toggleLandingPass('${id}', this)">${icon('eye',17)}</button>
      </div>
    </div>`;
}
function toggleLandingPass(id, btn){
  const el = document.getElementById(id);
  if(!el) return;
  const show = el.type==='password';
  el.type = show ? 'text' : 'password';
  btn.innerHTML = icon(show?'eyeOff':'eye', 17);
}


function paintLandingScreen(cardHtml){
  document.getElementById('app').innerHTML = `
    <div class="landing-shell">

          <div class="landing-card">${cardHtml}</div>

      <div class="landing-modules">
        <div class="landing-modules-grid">
          ${MODULE_SHOWCASE.map(m=>`
            <div class="module-card">
              <div class="module-card-icon mc-${m.color}">${icon(m.icon,21)}</div>

async function afterSignIn(){
  // RLS on mis_role_holders lets LCC/Parish-Minister roles see EVERY row,
  // not just their own — so this must filter by their own auth uid
  // explicitly rather than relying on RLS to narrow it, or a write role
  // signing in would get multiple rows back here.
  const { data: authUser } = await sb.auth.getUser();
  const uidNow = authUser && authUser.user ? authUser.user.id : null;
  if(!uidNow){ await sb.auth.signOut(); return false; }
  const { data: meRow, error } = await sb.from('mis_role_holders').select('*').eq('user_id', uidNow).eq('status','Active').maybeSingle();
  if(error || !meRow){
    // Not a recognised active role holder — sign out rather than leave a
    // half-authenticated session sitting around.
    await sb.auth.signOut();
    return false;
  }
  ME = meRow;
  sb.from('mis_role_holders').update({last_login:new Date().toISOString()}).eq('id', ME.id).then(()=>{});
  await fetchAll();
  if(!UI.view || !visibleNavItems().some(n=>n.key===UI.view)) UI.view = landingViewForRole();
  render();
  await logAudit('Signed in', 'Landed on '+navLabel(UI.view));
  return true;
}

function toCsvHref(headers, rows){
  const esc2 = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.map(esc2).join(','), ...rows.map(r=>r.map(esc2).join(','))].join('\n');
  return 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
}

async function fetchAll(){

    sb.from('mis_visitor_contacts').select('*').order('contact_date',{ascending:false}).then(r=>r.data||[]),
    sb.from('mis_services').select('*').order('service_date',{ascending:false}).then(r=>r.data||[]),
    sb.from('mis_events').select('*').order('event_date').then(r=>r.data||[]),

    sb.from('mis_pastoral_visits').select('*').order('visit_date',{ascending:false}).then(r=>r.data||[]),
    sb.from('mis_settings').select('*').eq('id',1).maybeSingle().then(r=>r.data||{mmf_assessed:0,mmf_paid:0,district_mmf_fixed:0,development_fund:0}),
    sb.from('mis_district_obligations').select('*').then(r=>r.data||[]),
    sb.from('mis_group_obligations').select('*').then(r=>r.data||[]),
    sb.from('mis_message_templates').select('*').order('created_at').then(r=>r.data||[]),
    sb.from('mis_communications').select('*').order('created_at',{ascending:false}).then(r=>r.data||[]),
  ]);
  STATE = { districts, members, households, groups, groupMembers, groupGiving, groupMeetings, roleHolders, visitors, visitorContacts, services, events, followups, pastoralVisits, settings:settingsRows, districtObligations, groupObligations, messageTemplates, communications, auditLog: [] };
  if(canSeeAuditLog()) await fetchAuditLog();
}
async function fetchAuditLog(){
  const { data } = await sb.from('mis_audit_log').select('*').order('ts',{ascending:false}).limit(200);
  STATE.auditLog = data || [];
}
async function refetch(key){
  if(key==='settings'){ const { data } = await sb.from('mis_settings').select('*').eq('id',1).maybeSingle(); STATE.settings = data || STATE.settings; return; }
  if(key==='districtObligations'){ const { data } = await sb.from('mis_district_obligations').select('*'); STATE.districtObligations = data || []; return; }
  if(key==='groupObligations'){ const { data } = await sb.from('mis_group_obligations').select('*'); STATE.groupObligations = data || []; return; }
  const table = {
    districts:'mis_districts', members:'mis_members', households:'mis_households',
    groups:'mis_groups', groupMembers:'mis_group_members', groupGiving:'mis_group_giving',
    groupMeetings:'mis_group_meetings', roleHolders:'mis_role_holders',
    visitors:'mis_visitors', visitorContacts:'mis_visitor_contacts', services:'mis_services', events:'mis_events',
    followups:'mis_pastoral_cases', pastoralVisits:'mis_pastoral_visits',
    messageTemplates:'mis_message_templates', communications:'mis_communications'
  }[key];
  let q = sb.from(table).select('*');
  if(key==='members' || key==='households' || key==='groups') q = q.eq('active', true);
  if(key==='groupMeetings' || key==='visitors' || key==='services') q = q.order(key==='visitors'?'visited':key==='services'?'service_date':'meeting_date',{ascending:false});
  else if(key==='visitorContacts') q = q.order('contact_date',{ascending:false});
  else if(key==='events') q = q.order('event_date');
  else if(key==='followups') q = q.order('due');
  else if(key==='pastoralVisits') q = q.order('visit_date',{ascending:false});
  else if(key==='messageTemplates') q = q.order('created_at');
  else if(key==='communications') q = q.order('created_at',{ascending:false});
  else if(key!=='groupMembers' && key!=='groupGiving') q = q.order('name');
  const { data } = await q;
  STATE[key] = data || [];
}

// group-member-files is a private bucket, so every photo/card thumbnail is
// shown via a short-lived signed URL rather than a public path. Signed URLs
// are cached per storage path (well under their 1hr expiry) and patched
// into <img> tags after each render, instead of re-rendering, since a full
// render() would refetch and re-flicker the whole page for an image load.
const SIGNED_URL_CACHE = new Map();
async function getSignedFileUrl(path){
  if(!path) return null;
  const cached = SIGNED_URL_CACHE.get(path);
  if(cached && cached.expiresAt > Date.now()+60000) return cached.url;
  const { data, error } = await sb.storage.from('group-member-files').createSignedUrl(path, 3600);
  if(error || !data) return null;
  SIGNED_URL_CACHE.set(path, { url: data.signedUrl, expiresAt: Date.now()+3600*1000 });
  return data.signedUrl;
}
function hydrateSignedUrls(){
  document.querySelectorAll('img[data-signed-path]').forEach(img=>{
    const path = img.getAttribute('data-signed-path');
    if(!path) return;
    getSignedFileUrl(path).then(url=>{ if(url) img.src = url; });
  });
}
async function uploadGroupMemberFile(groupId, personType, personId, field, file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file.'); return; }
  await withBusyState(async ()=>{
    const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    const path = `${groupId}/${personType}-${personId}-${field}-${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('group-member-files').upload(path, file, { contentType: file.type });
    if(upErr){ showToast('Could not upload: '+upErr.message); return; }
    const oldPath = (groupRosterFor(groupId).find(r=>r.personType===personType && r.personId===personId)||{}).gm[field];
    const { error } = await sb.from('mis_group_members').update({[field]:path}).eq('group_id',groupId).eq('person_type',personType).eq('person_id',personId);
    if(error){ showToast('Could not save: '+error.message); return; }
    if(oldPath) await sb.storage.from('group-member-files').remove([oldPath]);
    await refetch('groupMembers');
    render();
    showToast((field==='photo_url'?'Photo':'Membership card')+' uploaded.');
  });
}

function communionTotals(rows){

}
function serviceDaySummaries(){
  const map = {};
  filteredServiceRows().forEach(sv=>{
    if(!map[sv.service_date]) map[sv.service_date] = {date:sv.service_date, count:0, attendance:0, total:0, communionServices:0, communicants:0};
    map[sv.service_date].count += 1;
    map[sv.service_date].attendance += num(sv.attendance);
    map[sv.service_date].total += serviceRowTotal(sv);
    if(sv.holy_communion){
      map[sv.service_date].communionServices += 1;

  });
  return Object.values(map).sort((a,b)=>b.date.localeCompare(a.date));
}

async function saveServiceModal(){
  const p = UI.modalProps;
  const errs = { date: validateRequired(p.date,'Date'), serviceLeader: validateRequired(p.serviceLeader,'Service Leader') };
  UI.modalErrors = errs;
  if(errs.date || errs.serviceLeader){ render(); return; }
  const payload = {
    service_date:p.date, service_type:p.serviceType||SERVICE_TYPES[0], service_leader:p.serviceLeader.trim(), preacher:p.preacher.trim(),
    reading1:p.reading1.trim(), reading2:p.reading2.trim(), attendance:p.attendance||0,
    offering_amt:p.offeringAmt||0, tithe_amt:p.titheAmt||0, thanksgiving_amt:p.thanksgivingAmt||0, hc_offering_amt:p.hcOfferingAmt||0,
    holy_communion:p.holyCommunion==='Yes', communion_count:p.holyCommunion==='Yes' ? (p.communionCount??null) : null
  };
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_services').update(payload).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated service record', fmtDate(p.date));

      const { error } = await sb.from('mis_services').insert(payload);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Logged service', fmtDate(p.date));
      showToast('Service logged.');

function renderEventsCalendar(canEdit){
  const year = UI.calendarYear, month = UI.calendarMonth;
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-KE',{month:'long', year:'numeric'});
  const todayISO = new Date().toISOString().slice(0,10);
  const byDate = {};
  STATE.events.forEach(e=>{ (byDate[e.event_date] = byDate[e.event_date]||[]).push(e); });
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayEvents = byDate[iso]||[];
    const isToday = iso===todayISO;
    const isSelected = iso===UI.selectedDayKey;
    cells += `<button type="button" onclick="setUI({selectedDayKey:'${iso}'})" style="
      min-height:64px;padding:6px 4px;border:${isSelected?'1px solid var(--brass)':isToday?'1px solid var(--rule)':'1px solid transparent'};border-radius:3px;cursor:pointer;text-align:left;

      <span style="font-size:12px;font-weight:${isToday?'700':'400'};color:${isToday?'var(--brass)':'var(--charcoal)'};">${d}</span>
      ${dayEvents.slice(0,2).map(e=>`<span style="font-size:10.5px;background:var(--rule-light);border-radius:8px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(e.name)}</span>`).join('')}
      ${dayEvents.length>2 ? `<span style="font-size:10px;opacity:0.6;">+${dayEvents.length-2} more</span>` : ''}
    </button>`;
  }
  const selectedEvents = UI.selectedDayKey ? (byDate[UI.selectedDayKey]||[]) : [];
  return `
    <div class="card" style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <button class="btn-ghost" style="padding:5px 12px;" onclick="calChangeMonth(-1)">← Prev</button>
        <div style="font-family:var(--font-serif);font-size:16px;">${monthLabel}</div>
        <button class="btn-ghost" style="padding:5px 12px;" onclick="calChangeMonth(1)">Next →</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:left;font-size:11px;opacity:0.55;margin-bottom:4px;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
    </div>
    ${UI.selectedDayKey ? `
      <h3 style="font-size:15px;margin-bottom:12px;">${fmtDate(UI.selectedDayKey)} ${selectedEvents.length ? '('+selectedEvents.length+' event'+(selectedEvents.length===1?'':'s')+')' : ''}</h3>
      ${canEdit ? `<button class="btn-ghost" style="margin-bottom:14px;" onclick="openEventModal(null,'${UI.selectedDayKey}')">+ Add event on this day</button>` : ''}
      ${selectedEvents.map(e=>`
        <div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
          <div>
            <strong style="font-size:14px;">${esc(e.name)}</strong>
            <div style="font-size:12.5px;opacity:0.65;margin-top:2px;">${esc(e.category)} · ${esc(e.location)} · ${e.organizer_type==='group' ? `<a href="#" onclick="setUI({view:'groups', groupsSection:'Groups', selectedGroupId:'${e.organizer_group_id}'});return false;" style="color:var(--brass);">${esc(eventOrgName(e))}</a>` : 'Congregation-wide'}</div>
          </div>
          ${canEdit ? `<div style="display:flex;gap:6px;"><button class="btn-ghost" style="padding:4px 10px;font-size:12px;" onclick="openEventModal('${e.id}')">Edit</button><button class="btn-danger" onclick="confirmRemoveEvent('${e.id}')">Remove</button></div>` : ''}
        </div>`).join('') || '<div style="opacity:0.6;font-size:13.5px;">No events on this day.</div>'}
    ` : `<div style="font-size:11.5px;opacity:0.55;">Click a day to see its events, or add a new one.</div>`}
  `;

/* ---------------------------------------------------------------------
   FINANCE & GIVING
--------------------------------------------------------------------- */
function offeringTotal(){ return STATE.services.reduce((a,sv)=>a+num(sv.offering_amt),0); }
function titheTotal(){ return STATE.services.reduce((a,sv)=>a+num(sv.tithe_amt),0); }
function thanksgivingTotal(){ return STATE.services.reduce((a,sv)=>a+num(sv.thanksgiving_amt),0); }
function hcOfferingTotal(){ return STATE.services.reduce((a,sv)=>a+num(sv.hc_offering_amt),0); }
function groupContributionsTotal(){ return STATE.groups.reduce((a,g)=>a+num(g.week_collection),0); }
function financeSummary(){
  const offering = offeringTotal();
  const tithe = titheTotal();
  const thanksgiving = thanksgivingTotal();
  const hc = hcOfferingTotal();
  const sunday = offering + tithe + thanksgiving + hc;
  const group = groupContributionsTotal();
  const dev = num(STATE.settings.development_fund);
  const total = sunday + group + dev;
  const mmfAssessed = num(STATE.settings.mmf_assessed);
  const mmfPaid = num(STATE.settings.mmf_paid);
  const balance = mmfAssessed - mmfPaid;
  return { offering, tithe, thanksgiving, hc, sunday, group, dev, total, mmfAssessed, mmfPaid, balance };
}
function groupAnnualTotal(g){
  const givingSum = STATE.groupGiving.filter(r=>r.group_id===g.id).reduce((a,row)=>a+num(row.amount),0);
  return givingSum + num(g.week_collection);
}
function obligationsList(){
  const out = [];
  const districtFixed = num(STATE.settings.district_mmf_fixed);
  STATE.districts.forEach(d=>{
    const ob = STATE.districtObligations.find(o=>o.district_id===d.id) || {paid:0};
    const assessed = districtFixed;
    const balance = assessed - num(ob.paid);
    const status = balance<=0 ? 'Cleared' : num(ob.paid)>0 ? 'Partially Paid' : 'Unpaid';
    out.push({key:d.id, name:d.name, type:'District', obligation:'Parish MMF', assessed, paid:num(ob.paid), balance, status, dueMonth:null});
  });
  STATE.groups.forEach(g=>{
    if(g.fee_exempt) return;
    const ob = STATE.groupObligations.find(o=>o.group_id===g.id) || {paid:0};
    const assessed = num(g.budget);
    const balance = assessed - num(ob.paid);
    const status = balance<=0 ? 'Cleared' : num(ob.paid)>0 ? 'Partially Paid' : 'Unpaid';
    out.push({key:g.id, name:g.name, type:g.category, obligation:'Parish Activity Fee', assessed, paid:num(ob.paid), balance, status, dueMonth:g.collection_month});
  });
  return out;
}
function collectionsWeekly(){
  return [...STATE.services]
    .sort((a,b)=> new Date(b.service_date) - new Date(a.service_date))
    .map(sv=>({
      key:sv.id, label:fmtDate(sv.service_date), serviceType:sv.service_type||'1st Service',
      offering:num(sv.offering_amt), tithe:num(sv.tithe_amt), thanksgiving:num(sv.thanksgiving_amt), hc:num(sv.hc_offering_amt),
      total:serviceRowTotal(sv)
    }));
}
function collectionsMonthly(){
  const map = {};
  STATE.services.forEach(sv=>{
    const d = new Date(sv.service_date+'T00:00:00');
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!map[key]) map[key] = {key, label:d.toLocaleDateString('en-KE',{month:'long',year:'numeric'}), services:0, offering:0, tithe:0, thanksgiving:0, hc:0, total:0};
    map[key].services += 1;
    map[key].offering += num(sv.offering_amt); map[key].tithe += num(sv.tithe_amt);
    map[key].thanksgiving += num(sv.thanksgiving_amt); map[key].hc += num(sv.hc_offering_amt);
    map[key].total += serviceRowTotal(sv);
  });
  return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));
}
function collectionsQuarterly(){
  const qRange = ['Jan–Mar','Apr–Jun','Jul–Sep','Oct–Dec'];
  const map = {};
  STATE.services.forEach(sv=>{
    const d = new Date(sv.service_date+'T00:00:00');
    const q = Math.floor(d.getMonth()/3);
    const key = d.getFullYear()+'-Q'+(q+1);
    if(!map[key]) map[key] = {key, label:'Q'+(q+1)+' '+d.getFullYear()+' ('+qRange[q]+')', services:0, offering:0, tithe:0, thanksgiving:0, hc:0, total:0};
    map[key].services += 1;
    map[key].offering += num(sv.offering_amt); map[key].tithe += num(sv.tithe_amt);
    map[key].thanksgiving += num(sv.thanksgiving_amt); map[key].hc += num(sv.hc_offering_amt);
    map[key].total += serviceRowTotal(sv);
  });
  return Object.values(map).sort((a,b)=>b.key.localeCompare(a.key));
}

   plus a live-computed recipient/phone-number export; there is no SMS
   or email gateway, so nothing here is actually "sent".
--------------------------------------------------------------------- */
function communicationAudienceOptions(){
  return {
    'Whole Congregation': [{value:'', label:'Everyone on the active roll'}],
    'District': STATE.districts.map(d=>({value:d.id, label:d.name})),
    'Group': STATE.groups.map(g=>({value:g.id, label:g.name})),
    'Individual Member': STATE.members.map(m=>({value:m.id, label:m.name}))
  };
}
function communicationRecipients(audienceType, value){
  const out = [];
  const pushPerson = (name, phone) => out.push({name, phone:(phone||'').trim()});
  const householdsOf = memberId => STATE.households.filter(h=>h.owner_member_id===memberId);
  if(audienceType==='Whole Congregation'){
    STATE.members.forEach(m=>{ pushPerson(m.name, m.phone); householdsOf(m.id).forEach(h=>pushPerson(h.name, h.phone)); });
  } else if(audienceType==='District'){
    STATE.members.filter(m=>m.district_id===value).forEach(m=>{ pushPerson(m.name, m.phone); householdsOf(m.id).forEach(h=>pushPerson(h.name, h.phone)); });
  } else if(audienceType==='Group'){
    const g = STATE.groups.find(x=>x.id===value);
    if(g) groupRosterFor(g.id).forEach(r=>pushPerson(r.name, r.phone));
  } else if(audienceType==='Individual Member'){
    const m = STATE.members.find(x=>x.id===value);
    if(m) pushPerson(m.name, m.phone);
  }
  return out;
}
function communicationAudienceLabel(audienceType, value){
  if(audienceType==='Whole Congregation') return 'Whole congregation';
  if(audienceType==='District') return districtName(value) || 'District';
  if(audienceType==='Group') return (STATE.groups.find(g=>g.id===value)||{}).name || 'Group';
  if(audienceType==='Individual Member') return (STATE.members.find(m=>m.id===value)||{}).name || 'Member';
  return '';
}

function applyTemplateToCompose(templateId){

async function sendCommunicationNow(){
  const p = UI.modalProps;
  const errs = { message: validateRequired(p.message,'Message') };
  UI.modalErrors = errs;
  if(errs.message){ render(); return; }
  const recipients = communicationRecipients(p.audienceType, p.audienceValue);
  const withPhone = recipients.filter(r=>r.phone);
  const label = communicationAudienceLabel(p.audienceType, p.audienceValue);
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_communications').insert({
      channel:p.channel, audience_type:p.audienceType, audience_label:label,
      recipient_count:recipients.length, phone_count:withPhone.length, message:p.message.trim(),
      sent_by:ME.name, recipients:withPhone.map(r=>r.phone)
    });
    if(error){ showToast('Could not save: '+error.message); return; }
    await logAudit('Logged communication', p.channel+' to '+label+' ('+recipients.length+' recipients)');
    await refetch('communications');
    UI.modal=null; render(); showToast('Communication logged.');
  });
}

}
function openTemplateModal(id){

async function saveTemplateModal(){
  const p = UI.modalProps;
  const errs = { name: validateRequired(p.name,'Name'), body: validateRequired(p.body,'Message') };
  UI.modalErrors = errs;
  if(errs.name || errs.body){ render(); return; }
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_message_templates').update({name:p.name.trim(), channel:p.channel, body:p.body.trim()}).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated message template', p.name.trim());
      showToast('Template updated.');
    }else{
      const { error } = await sb.from('mis_message_templates').insert({name:p.name.trim(), channel:p.channel, body:p.body.trim()});
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Added message template', p.name.trim());
      showToast('Template added.');
    }
    await refetch('messageTemplates');
    UI.modal=null; render();
  });
}
async function confirmRemoveTemplate(id){
  const t = STATE.messageTemplates.find(x=>x.id===id);
  if(!t) return;
  if(!confirm('Delete the "'+t.name+'" template?')) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_message_templates').delete().eq('id', id);
    if(error){ showToast('Could not delete: '+error.message); return; }
    await logAudit('Removed message template', t.name);
    await refetch('messageTemplates');
    render();
    showToast('Template removed.');
  });
}

function smsOverLimit(text, channel){ return channel==='SMS' && text.length>160; }
function charCountStyle(text, channel){
  const over = smsOverLimit(text, channel);
  return `font-size:11.5px;margin:-8px 0 14px;${over ? 'color:var(--wine);font-weight:600;' : 'opacity:0.6;'}`;
}
function smsCharCountLabel(text, channel){
  const len = text.length;
  if(channel!=='SMS') return len+' character'+(len===1?'':'s');
  const segments = len===0 ? 1 : Math.ceil(len/160);
  const base = len+' character'+(len===1?'':'s')+' · '+segments+' SMS segment'+(segments===1?'':'s')+' (160 characters each)';
  return smsOverLimit(text, channel) ? '⚠ '+base+' — over the 160-character single-segment limit' : base;
}
function updateComposeMessage(el){
  UI.modalProps.message = el.value;
  const counter = document.getElementById('msgCharCount');
  if(counter){
    counter.textContent = smsCharCountLabel(el.value, UI.modalProps.channel);
    counter.style.cssText = charCountStyle(el.value, UI.modalProps.channel);
  }
}

function statCard(label,value,hint,viewKey){
  const clickable = viewKey && visibleNavItems().some(n=>n.key===viewKey);
  const attrs = clickable ? `onclick="setUI({view:'${viewKey}'})" style="cursor:pointer;" role="link" tabindex="0" onkeydown="if(event.key==='Enter')setUI({view:'${viewKey}'})"` : '';
  return `<div class="card" ${attrs}><div style="font-size:12px;opacity:0.6;margin-bottom:6px;">${esc(label)}</div><div class="stat-num">${value}</div><div style="font-size:11.5px;opacity:0.55;margin-top:4px;">${esc(hint)}</div></div>`;
}
function financeDonutChart(fin){
  const segments = [
    {label:'Sunday offertory', value:fin.sunday, color:'#2A78D6'},
    {label:'Groups & districts', value:fin.group, color:'#C9860F'},
    {label:'Development fund', value:fin.dev, color:'#0D9488'}
  ];
  const total = segments.reduce((a,s)=>a+s.value,0);
  const size = 148, r = 56, cx = size/2, cy = size/2, sw = 20, circumference = 2*Math.PI*r;
  let cursor = 0;
  const arcs = total>0 ? segments.filter(s=>s.value>0).map(s=>{
    const frac = s.value/total;
    const dash = Math.max(frac*circumference-2, 0);
    const rotation = (cursor/total)*360 - 90;
    cursor += s.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${circumference-dash}" transform="rotate(${rotation} ${cx} ${cy})"><title>${esc(s.label)}: ${fmtKES(s.value)} (${Math.round(frac*100)}%)</title></circle>`;
  }).join('') : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--rule-light)" stroke-width="${sw}"></circle>`;
  return `
    <div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap;">
      <div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0;">
        <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${arcs}</svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
          <div style="font-size:10.5px;opacity:0.6;">Total</div>
          <div style="font-size:14px;font-weight:600;line-height:1.25;">${fmtKES(total)}</div>
        </div>
      </div>
      <div style="flex:1;min-width:170px;">
        ${segments.map(s=>{
          const pct = total>0 ? Math.round(s.value/total*100) : 0;
          return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:12.5px;">
            <span style="display:flex;align-items:center;gap:7px;"><span style="width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block;flex-shrink:0;"></span>${esc(s.label)}</span>
            <span style="text-align:right;white-space:nowrap;"><strong>${fmtKES(s.value)}</strong> <span style="opacity:0.55;">${pct}%</span></span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}
function trendBarRow(label,val,max,unit){
  const pct = max>0 ? Math.round(val/max*100) : 0;
  return `<div style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;"><span>${esc(label)}</span><span>${Number(val).toLocaleString()}${unit?' '+esc(unit):''}</span></div>
    <div style="background:var(--rule-light);height:6px;border-radius:3px;overflow:hidden;"><div style="background:var(--forest);width:${pct}%;height:100%;"></div></div>
  </div>`;
}
function field(label, inputHtml, err){
  return `<div style="margin-bottom:14px;flex:1;min-width:130px;"><label class="field-label">${esc(label)}</label>${inputHtml}${errLine(err)}</div>`;
}
function errLine(msg){ return msg ? `<div class="field-err">${esc(msg)}</div>` : ''; }
function setModalProp(key, value){ UI.modalProps[key]=value; render(); }
// Most modal text fields have nothing else on screen depending on their
// live value as you type, so re-rendering the entire app on every
// keystroke (as setModalProp does) just repaints the whole page for no
// visual benefit — that repaint is what shows up as flicker on fields
// like District name or a member's name/address. The browser already
// keeps the input's own displayed text correct on its own; this only
// needs to remember the value for when Save is clicked.
function setModalPropQuiet(key, value){ UI.modalProps[key]=value; }
function validateRequired(v,label){ return (v && String(v).trim()) ? '' : (label+' is required.'); }


/* ---------------------------------------------------------------------
   SHARED SELECTORS
--------------------------------------------------------------------- */
function districtName(id){ const d = STATE.districts.find(x=>x.id===id); return d ? d.name : ''; }
function groupById(id){ return STATE.groups.find(g=>g.id===id); }
function groupName(id){ const g = groupById(id); return g ? g.name : ''; }
function elderForDistrict(id){ const d = STATE.districts.find(x=>x.id===id); return d ? d.elder_name : '—'; }
function totalPeopleCount(){ return STATE.members.length + STATE.households.length; }
// A "household" is the family unit — a member plus whichever dependants
// are linked to them, counted once — not a headcount of the dependant
// records themselves. Two dependants under the same member is still 1
// household, not 2.
function householdUnitsCount(){ return new Set(STATE.households.map(h=>h.owner_member_id)).size; }
function totalGroupsCount(){ return STATE.groups.length; }
function groupRosterFor(groupId){
  return STATE.groupMembers.filter(gm=>gm.group_id===groupId).map(gm=>{
    const person = gm.person_type==='member'
      ? STATE.members.find(m=>m.id===gm.person_id)
      : STATE.households.find(h=>h.id===gm.person_id);
    if(!person) return null;
    const ownerDistrictId = gm.person_type==='member' ? person.district_id
      : (STATE.members.find(m=>m.id===person.owner_member_id)||{}).district_id;
    return {
      gm, personType:gm.person_type, personId:gm.person_id, name:person.name,
      phone:person.phone, districtId:ownerDistrictId, districtName:districtName(ownerDistrictId)
    };
  }).filter(Boolean);
}
function totalGroupMembersCount(){ return STATE.groupMembers.length; }
function membershipByStatus(){
  const counts = {};
  STATE.members.forEach(m=>{ counts[m.status]=(counts[m.status]||0)+1; });
  STATE.households.forEach(h=>{ counts[h.status]=(counts[h.status]||0)+1; });
  const total = totalPeopleCount() || 1;
  return Object.entries(counts).map(([label,count])=>({label,count,pct:Math.round(count/total*100)}));
}
function membershipByDistrict(){
  const counts = {};
  STATE.members.forEach(m=>{ const dn = districtName(m.district_id); counts[dn]=(counts[dn]||0)+1; });
  STATE.households.forEach(h=>{ const owner = STATE.members.find(m=>m.id===h.owner_member_id); if(!owner) return; const dn = districtName(owner.district_id); counts[dn]=(counts[dn]||0)+1; });
  const max = Math.max(...Object.values(counts),1);
  return Object.entries(counts).map(([label,count])=>({label,count,pct:Math.round(count/max*100)}));
}
function categoryBreakdown(){
  const fellow = STATE.groups.filter(g=>g.category==='Fellowship');
  const comm = STATE.groups.filter(g=>g.category==='Committee');
  const fm = fellow.reduce((a,g)=>a+groupRosterFor(g.id).length,0);
  const cm = comm.reduce((a,g)=>a+groupRosterFor(g.id).length,0);
  const max = Math.max(fm,cm,1);
  return [
    {label:'Fellowships', members:fm, count:fellow.length, pct:Math.round(fm/max*100)},
    {label:'Committees', members:cm, count:comm.length, pct:Math.round(cm/max*100)}
  ];
}
function communionCount(){ return STATE.services.filter(sv=>sv.holy_communion).length; }
function followupOpenCount(){ return STATE.followups.filter(f=>f.status!=='Closed').length; }

const SERVICE_TYPE_COLORS = {
  '1st Service':'#2A78D6', '2nd Service':'#C9860F', 'Joint Service':'#15803D',
  'Youth Service':'#7C3AED', 'Church School':'#DC2626'
};
function weekStartDate(year, weekIdx){
  const jan1 = new Date(year,0,1);
  const d = new Date(jan1); d.setDate(jan1.getDate()+weekIdx*7);
  return d;
}
function weeklyServiceAttendance(){
  const year = new Date().getFullYear();
  const jan1 = new Date(year,0,1);
  const weeks = Array.from({length:52}, (_,i)=>{
    const byType = {}; SERVICE_TYPES.forEach(t=>byType[t]=0);
    return {week:i, start:weekStartDate(year,i), byType};
  });
  STATE.services.forEach(sv=>{
    const d = new Date(sv.service_date+'T00:00:00');
    if(d.getFullYear()!==year) return;
    const idx = Math.floor((d-jan1)/(7*86400000));
    if(idx<0 || idx>=52) return;
    const type = SERVICE_TYPES.includes(sv.service_type) ? sv.service_type : SERVICE_TYPES[0];
    weeks[idx].byType[type] += num(sv.attendance);
  });
  return weeks;
}
function weeklyAttendanceChart(){
  const weeks = weeklyServiceAttendance();
  const totals = weeks.map(w=>SERVICE_TYPES.reduce((a,t)=>a+w.byType[t],0));
  const max = Math.max(...totals, 1);
  const peakIdx = totals.indexOf(Math.max(...totals));
  const barW = 11, gap = 3, chartH = 130;
  return `
    <div style="font-size:11.5px;opacity:0.6;margin-bottom:12px;">
      ${Math.max(...totals)>0 ? `Peak week: ${fmtDate(weeks[peakIdx].start.toISOString().slice(0,10))} — ${Math.max(...totals).toLocaleString()} total attendance` : 'No attendance recorded yet this year.'}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;">
      ${SERVICE_TYPES.map(t=>`<span style="display:flex;align-items:center;gap:6px;font-size:11.5px;"><span style="width:10px;height:10px;border-radius:2px;background:${SERVICE_TYPE_COLORS[t]||'#898781'};display:inline-block;flex-shrink:0;"></span>${esc(t)}</span>`).join('')}
    </div>
    <div style="overflow-x:auto;padding-bottom:6px;">
      <div style="display:flex;align-items:flex-end;gap:${gap}px;height:${chartH}px;min-width:${weeks.length*(barW+gap)}px;">
        ${weeks.map((w,i)=>{
          const segs = SERVICE_TYPES.map(t=>{
            const v = w.byType[t];
            if(v<=0) return '';
            const hPct = (v/max*100);
            return `<div style="width:100%;height:${hPct}%;background:${SERVICE_TYPE_COLORS[t]||'#898781'};" title="${esc(t)}: ${v} — week of ${esc(fmtDate(w.start.toISOString().slice(0,10)))}"></div>`;
          }).join('');
          return `<div style="display:flex;flex-direction:column;justify-content:flex-end;width:${barW}px;height:100%;flex-shrink:0;" title="Week of ${esc(fmtDate(w.start.toISOString().slice(0,10)))} — ${totals[i].toLocaleString()} total">
            ${segs || `<div style="width:100%;height:2px;background:var(--rule-light);"></div>`}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:${gap}px;min-width:${weeks.length*(barW+gap)}px;margin-top:4px;">
        ${weeks.map((w,i)=>{
          const isMonthStart = i===0 || w.start.getMonth() !== weeks[i-1].start.getMonth();
          return `<div style="width:${barW}px;flex-shrink:0;font-size:9.5px;opacity:0.55;white-space:nowrap;">${isMonthStart ? esc(w.start.toLocaleDateString('en-KE',{month:'short'})) : ''}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderGroups(){
  const role = sessionRole();
  const restrictedToId = GROUP_SCOPED_ROLES.includes(role) ? sessionGroupId() : null;

  if(UI.selectedGroupId){
    const g = groupById(UI.selectedGroupId);
    if(g) return renderGroupDetail(g);
    UI.selectedGroupId = null;
  }
  if(!restrictedToId && UI.groupsSection==='Districts') return renderDistrictsTab();

  let list = STATE.groups;
  if(restrictedToId) list = list.filter(g=>g.id===restrictedToId);
  const q = UI.groupSearch.trim().toLowerCase();
  list = list.filter(g=>UI.category==='All'||g.category===UI.category).filter(g=>!q||g.name.toLowerCase().includes(q)||(g.patron||'').toLowerCase().includes(q));

  const headerSub = restrictedToId
    ? groupRosterFor(restrictedToId).length+' on the roster'
    : totalGroupsCount()+' groups · '+totalGroupMembersCount()+' memberships';
  return `
    ${sectionHeader('Districts & Groups', headerSub, restrictedToId ? '' : `<button class="btn" onclick="openGroupModal(null)">New group</button>`)}
    ${!restrictedToId ? `<div style="display:flex;gap:20px;border-bottom:1px solid var(--rule);margin-bottom:20px;">
      ${['Districts','Groups'].map(t=>`<button onclick="setUI({groupsSection:'${t}'})" style="background:none;border:none;padding-bottom:9px;font-size:13.5px;border-bottom:2px solid ${UI.groupsSection===t?'var(--brass)':'transparent'};color:${UI.groupsSection===t?'var(--ink)':'var(--charcoal)'};font-weight:${UI.groupsSection===t?'600':'400'};">${t}</button>`).join('')}
    </div>` : ''}
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;flex-wrap:wrap;">
      ${!restrictedToId ? `<input class="field-input" style="max-width:260px;" placeholder="Search by group or patron" value="${esc(UI.groupSearch)}" oninput="setUI({groupSearch:this.value})">` : ''}
      ${!restrictedToId ? ['All','Fellowship','Committee'].map(c=>`<button class="btn-ghost" style="border-color:${UI.category===c?'var(--brass)':'var(--rule)'};" onclick="setUI({category:'${c}'})">${c==='All'?'All':c+'s'}</button>`).join('') : ''}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;">
      ${list.map(g=>{
        const roster = groupRosterFor(g.id);
        const officials = groupOfficialsSummary(g.id);
        return `<div class="card" style="cursor:pointer;" onclick="setUI({selectedGroupId:'${g.id}', groupTab:'Members'})">
          <div style="font-size:10.5px;letter-spacing:0.03em;color:var(--brass);margin-bottom:4px;">${esc(g.category)}</div>
          <div style="font-family:var(--font-serif);font-size:17px;margin-bottom:6px;">${esc(g.name)}</div>
          <div style="font-size:12.5px;opacity:0.65;">Patron: ${esc(g.patron||'Not assigned')} · ${esc(g.meeting_day)} ${esc(g.meeting_time)}</div>
          ${officials.length ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--rule-light);font-size:12px;line-height:1.7;">
            ${officials.map(o=>`<div><span style="opacity:0.55;">${esc(o.office)}:</span> ${esc(o.name)}</div>`).join('')}
          </div>` : ''}
          <div style="display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-light);font-size:12.5px;">
            <span>${roster.length} on roster</span><span>${g.fee_exempt ? 'Membership only' : fmtKES(g.week_collection)+' this week'}</span>
          </div>
        </div>`;
      }).join('') || '<div style="opacity:0.6;font-size:13.5px;">No groups match.</div>'}

  `;
}
function groupOfficialsSummary(groupId){
  const g = groupById(groupId);
  if(!g) return [];
  return [
    {office:'Chair', name:g.chair}, {office:'Vice Chair', name:g.vice_chair},
    {office:'Secretary', name:g.secretary}, {office:'Vice Secretary', name:g.vice_secretary},
    {office:'Treasurer', name:g.treasurer}
  ].filter(o=>o.name);
}

async function saveDistrictModal(){
  const p = UI.modalProps;
  const errs = { name: validateRequired(p.name,'District name'), elder_name: validateRequired(p.elder_name,'Elder name') };
  UI.modalErrors = errs;
  if(errs.name || errs.elder_name){ render(); return; }
  const deacons = p.deacons.map(d=>d.trim()).filter(Boolean).slice(0,MAX_DEACONS_PER_DISTRICT);
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_districts').update({name:p.name.trim(), elder_name:p.elder_name.trim(), deacons}).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated district', p.name.trim());
      showToast('District updated.');
    }else{
      const { error } = await sb.from('mis_districts').insert({name:p.name.trim(), elder_name:p.elder_name.trim(), deacons});
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Added district', p.name.trim());
      showToast('District added.');
    }
    await refetch('districts');
    UI.modal=null; render();
  });
}
async function confirmRemoveDistrict(id){
  const d = STATE.districts.find(x=>x.id===id);
  if(!d) return;
  if(STATE.districts.length<=1){ showToast('At least one district must remain.'); return; }
  const memberCount = STATE.members.filter(m=>m.district_id===id).length;
  if(memberCount>0){ showToast(d.name+' still has '+memberCount+' member'+(memberCount===1?'':'s')+' assigned — reassign them first.'); return; }
  const userCount = STATE.roleHolders.filter(u=>u.district_id===id).length;
  if(userCount>0){ showToast(d.name+' still has '+userCount+' user'+(userCount===1?'':'s')+' assigned — reassign them first.'); return; }
  if(!confirm('Delete the '+d.name+' district? This cannot be undone.')) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_districts').delete().eq('id', id);
    if(error){ showToast('Could not delete: '+error.message); return; }
    await logAudit('Removed district', d.name);
    await refetch('districts');
    showToast(d.name+' deleted.');
    render();
  });
}

/* ---- Group detail ---- */

  const roster = groupRosterFor(g.id);

    <div style="margin-bottom:8px;"><a href="#" onclick="setUI({selectedGroupId:null, focusName:null});return false;" style="font-size:12.5px;color:var(--charcoal);opacity:0.7;">← All groups</a></div>
    ${sectionHeader(g.name, 'Patron: '+esc(g.patron||'Not assigned')+' · '+esc(g.meeting_day)+' '+esc(g.meeting_time)+' · '+esc(g.location), canEdit ? `<button class="btn-ghost" onclick="openGroupModal('${g.id}')">Edit details</button><button class="btn-danger" onclick="confirmRemoveGroup('${g.id}')">Delete group</button>` : '')}
    ${renderOfficialsCard(g, roster, canEdit)}
    <div style="display:flex;gap:20px;border-bottom:1px solid var(--rule);margin-bottom:20px;overflow-x:auto;">

    </div>

    ${UI.groupTab==='Fellowships' ? renderGroupMeetingsTab(g, canEdit) : ''}
    ${UI.groupTab==='Contribution/Donations' ? renderGroupGivingTab(g, canEdit) : ''}

function renderOfficialsCard(g, roster, canEdit){
  // Officials are typed in directly rather than forced through a picker —
  // the person holding an office isn't always someone already entered
  // elsewhere in the system.
  const fields = [
    ['Patron','patron'], ['Chair','chair'], ['Vice Chair','vice_chair'],
    ['Secretary','secretary'], ['Vice Secretary','vice_secretary'], ['Treasurer','treasurer']
  ];
  return `
    <div class="card" style="margin-bottom:20px;max-width:640px;">
      <h3 style="font-size:13.5px;margin-bottom:12px;">Officials at a glance</h3>
      <div class="officials-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        ${fields.map(([label,key])=>`<div>
          <div style="font-size:11.5px;opacity:0.6;margin-bottom:4px;">${esc(label)}</div>
          ${canEdit ? `<input class="field-input" placeholder="Not assigned" value="${esc(g[key])}" onchange="updateGroupField('${g.id}','${key}', this.value)">` : `<div style="font-size:13.5px;">${esc(g[key]||'Not assigned')}</div>`}
        </div>`).join('')}

function fileThumbCell(g, r, field, canEdit){
  const path = r.gm[field];
  const inputId = 'upload-'+field+'-'+r.personType+'-'+r.personId;
  return `<td>
    <div style="display:flex;align-items:center;gap:6px;">
      ${path ? `<img data-signed-path="${esc(path)}" style="width:28px;height:28px;border-radius:${field==='photo_url'?'50%':'4px'};object-fit:cover;background:var(--rule-light);cursor:pointer;" onclick="openViewFileForGroupMember('${g.id}','${r.personType}','${r.personId}','${field}')">` : `<span style="opacity:0.4;font-size:11px;">—</span>`}
      ${path ? `<a href="#" onclick="openViewFileForGroupMember('${g.id}','${r.personType}','${r.personId}','${field}');return false;" style="font-size:11px;color:var(--ink);opacity:0.75;">View</a>` : ''}
      ${canEdit ? `<label for="${inputId}" style="cursor:pointer;font-size:11px;color:var(--brass);font-weight:600;">${path?'Replace':'Add'}</label>
      <input id="${inputId}" type="file" accept="image/*" style="display:none;" onchange="uploadGroupMemberFile('${g.id}','${r.personType}','${r.personId}','${field}',this.files[0])">` : ''}

}
function openViewFileForGroupMember(groupId, personType, personId, field){

  const label = field==='photo_url' ? 'Photo' : 'Membership card';
  UI.modal = 'viewFile';
  UI.modalProps = { path: r.gm[field], title: r.name+' — '+label };

}
function viewFileModalBody(){

function renderGroupMembersTab(g, roster, canEdit){
  const hasCardFields = CARD_GROUPS.includes(g.name);
  return `
    ${UI.focusName ? `<div class="banner">Showing only ${esc(UI.focusName)}. <a href="#" onclick="setUI({focusName:null});return false;" style="color:var(--brass);">Show full roster</a></div>` : ''}
    ${canEdit ? renderAddToRoster(g) : ''}

    ${roster.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.districtName||'—')}</td><td>${esc(r.phone||'—')}</td>
      ${hasCardFields ? fileThumbCell(g,r,'photo_url',canEdit)+fileThumbCell(g,r,'card_image',canEdit) : ''}
      ${canEdit ? `<td><button class="btn-danger" style="padding:4px 9px;font-size:11.5px;" onclick="removeFromRoster('${g.id}','${r.personType}','${r.personId}')">Remove</button></td>` : ''}
    </tr>`).join('') || `<tr><td colspan="${(hasCardFields?2:0)+(canEdit?4:3)}" style="opacity:0.6;">No one is currently assigned to this group.</td></tr>`}

  `;

function renderAddToRoster(g){
  const existingKeys = new Set(groupRosterFor(g.id).map(r=>r.personType+':'+r.personId));
  const memberOptions = STATE.members.filter(m=>!existingKeys.has('member:'+m.id)).map(m=>({key:'member:'+m.id, label:m.name}));
  const householdOptions = STATE.households.filter(h=>!existingKeys.has('household:'+h.id)).map(h=>({key:'household:'+h.id, label:h.name+' (household)'}));
  const options = [...memberOptions, ...householdOptions].sort((a,b)=>a.label.localeCompare(b.label));
  return `
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end;">
      <div style="min-width:220px;">
        <label class="field-label">Add to roster</label>
        <select class="field-input" id="addRosterSelect-${g.id}">
          <option value="">Choose a person…</option>
          ${options.map(o=>`<option value="${o.key}">${esc(o.label)}</option>`).join('')}
        </select>
      </div>
      <button class="btn-ghost" onclick="addToRoster('${g.id}')">+ Add</button>
    </div>
  `;
}
async function addToRoster(groupId){
  const sel = document.getElementById('addRosterSelect-'+groupId);
  if(!sel || !sel.value){ showToast('Choose a person to add.'); return; }
  const [personType, personId] = sel.value.split(':');
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_group_members').insert({group_id:groupId, person_type:personType, person_id:personId});
    if(error){ showToast('Could not add: '+error.message); return; }
    await logAudit('Added to group roster', groupName(groupId));
    await refetch('groupMembers');
    render();
    showToast('Added to roster.');
  });
}
async function removeFromRoster(groupId, personType, personId){
  if(!confirm('Remove this person from the roster? This does not delete their member record.')) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_group_members').delete().eq('group_id',groupId).eq('person_type',personType).eq('person_id',personId);
    if(error){ showToast('Could not remove: '+error.message); return; }
    await logAudit('Removed from group roster', groupName(groupId));
    await refetch('groupMembers');
    render();
  });
}

}
async function updateGroupField(id, field, value){

    await refetch('groups');

function openGroupModal(id){

    ? {id, name:editing.name, category:editing.category, meeting_day:editing.meeting_day, meeting_time:editing.meeting_time, location:editing.location, collection_month:editing.collection_month||'', fee_exempt:!!editing.fee_exempt,
       patron:editing.patron||'', chair:editing.chair||'', vice_chair:editing.vice_chair||'', secretary:editing.secretary||'', vice_secretary:editing.vice_secretary||'', treasurer:editing.treasurer||''}
    : {id:null, name:'', category:'Fellowship', meeting_day:'', meeting_time:'', location:'', collection_month:'', fee_exempt:false,

async function saveGroupModal(){
  const p = UI.modalProps;
  const errs = {name: validateRequired(p.name,'Name')};
  UI.modalErrors = errs;
  if(errs.name){ render(); return; }
  const payload = { name:p.name.trim(), category:p.category, meeting_day:p.meeting_day.trim(), meeting_time:p.meeting_time.trim(), location:p.location.trim(), fee_exempt:!!p.fee_exempt, collection_month: p.fee_exempt ? null : (p.collection_month||null),
    patron:p.patron.trim(), chair:p.chair.trim(), vice_chair:p.vice_chair.trim(), secretary:p.secretary.trim(), vice_secretary:p.vice_secretary.trim(), treasurer:p.treasurer.trim() };
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_groups').update(payload).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated group', p.name.trim());
      showToast('Group updated.');
    }else{
      const { error } = await sb.from('mis_groups').insert(payload);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Created group', p.name.trim());
      showToast('Group created.');
    }
    await refetch('groups');
    UI.modal=null; render();

async function confirmRemoveGroup(id){
  const g = groupById(id);
  if(!g) return;
  const roster = groupRosterFor(id);
  const msg = roster.length ? `${g.name} still has ${roster.length} people assigned. Delete anyway?` : `Delete ${g.name}? This cannot be undone.`;
  if(!confirm(msg)) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_groups').update({active:false}).eq('id', id);
    if(error){ showToast('Could not delete: '+error.message); return; }
    await logAudit('Deleted group', g.name);
    await refetch('groups');
    UI.selectedGroupId=null; render();
    showToast(g.name+' deleted.');
  });
}


/* ---------------------------------------------------------------------
   MEMBERSHIP & HOUSEHOLDS
--------------------------------------------------------------------- */
const STATUS_OPTIONS = ['Communicant Member','Baptized Member','Adherent'];
function visibleDistricts(){
  const role = sessionRole();
  if(PASTORAL_DISTRICT_ROLES.includes(role) && sessionDistrictId()) return STATE.districts.filter(d=>d.id===sessionDistrictId());
  return STATE.districts;
}
function renderMembers(){
  if(UI.selectedHouseholdId){
    const h = STATE.households.find(x=>x.id===UI.selectedHouseholdId);
    const owner = h ? STATE.members.find(m=>m.id===h.owner_member_id) : null;
    if(owner && h) return renderHouseholdDetail(owner, h);
    UI.selectedHouseholdId = null;
  }
  if(UI.selectedMemberId){
    const m = STATE.members.find(x=>x.id===UI.selectedMemberId);
    if(m) return renderMemberDetail(m);
    UI.selectedMemberId = null;
  }
  if(UI.selectedDistrict){
    if(visibleDistricts().some(d=>d.id===UI.selectedDistrict)) return renderDistrictMembers(UI.selectedDistrict);
    UI.selectedDistrict = null;
  }
  return renderDistrictSummary();
}
function householdsFor(memberId){ return STATE.households.filter(h=>h.owner_member_id===memberId); }
function renderDistrictSummary(){
  const canEdit = canWrite();
  const dists = visibleDistricts();
  const q = UI.memberSearch.trim().toLowerCase();
  if(q){
    const matches = STATE.members.filter(m=>dists.some(d=>d.id===m.district_id)).filter(m=>m.name.toLowerCase().includes(q));
    return `
      ${sectionHeader('Membership & Households', matches.length+' match'+(matches.length===1?'':'es')+' for "'+esc(UI.memberSearch)+'"', canEdit?`<button class="btn" onclick="openMemberModal(null)">Add member</button>`:'')}
      <input class="field-input" style="max-width:260px;margin-bottom:20px;" placeholder="Search members" value="${esc(UI.memberSearch)}" oninput="setUI({memberSearch:this.value})">
      ${matches.length===0 ? `<div style="font-size:13px;opacity:0.55;">No members match.</div>` : matches.map(m=>renderMemberRow(m, canEdit)).join('')}
    `;
  }
  return `
    ${sectionHeader('Membership & Households', totalPeopleCount()+' people across '+dists.length+' district'+(dists.length===1?'':'s'), canEdit?`<button class="btn" onclick="openMemberModal(null)">Add member</button>`:'')}
    <input class="field-input" style="max-width:260px;margin-bottom:20px;" placeholder="Search members" value="${esc(UI.memberSearch)}" oninput="setUI({memberSearch:this.value})">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;">
      ${dists.map(d=>{
        const list = STATE.members.filter(m=>m.district_id===d.id);
        const dependantCount = list.reduce((a,m)=>a+householdsFor(m.id).length,0);
        const householdCount = list.filter(m=>householdsFor(m.id).length>0).length;

async function confirmRemoveMember(id){
  const m = STATE.members.find(x=>x.id===id);
  if(!m) return;
  if(!confirm('Remove '+m.name+' from the active roll? This also removes their household record from active lists.')) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_members').update({active:false}).eq('id', id);
    if(error){ showToast('Could not remove: '+error.message); return; }
    await logAudit('Removed member', m.name);
    await refetch('members'); await refetch('households');
    UI.selectedMemberId = null; render();
    showToast(m.name+' removed from active roll.');
  });
}
async function confirmRemoveHousehold(hId){

    : {id:null, name:'', status:'Communicant Member', district_id: UI.selectedDistrict||(STATE.districts[0]||{}).id, gender:'Male', phone:'', residence:'', groupId:''};

async function saveMemberModal(){
  const p = UI.modalProps;
  const errs = { name: validateRequired(p.name,'Name'), district_id: validateRequired(p.district_id,'District') };
  UI.modalErrors = errs;
  if(errs.name || errs.district_id){ render(); return; }
  const payload = { name:p.name.trim(), status:p.status, district_id:p.district_id, gender:p.gender, phone:p.phone.trim(), residence:p.residence.trim() };
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_members').update(payload).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated member', p.name.trim());
      showToast('Member updated.');
    }else{
      const { data, error } = await sb.from('mis_members').insert({...payload, since:String(new Date().getFullYear())}).select().single();
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Added member', p.name.trim());
      if(p.groupId){
        const { error: gErr } = await sb.from('mis_group_members').insert({group_id:p.groupId, person_type:'member', person_id:data.id});
        if(!gErr) await refetch('groupMembers');
      }
      showToast('Member added.');
    }
    await refetch('members');
    UI.modal=null; render();
  });
}
function openHouseholdModal(memberId, hId){
  const editing = hId ? STATE.households.find(h=>h.id===hId) : null;
  UI.modal='household';
  UI.modalProps = editing
    ? {memberId, hId, name:editing.name, relationship:editing.relationship, status:editing.status, phone:editing.phone, age_group:editing.age_group, gender:editing.gender}
    : {memberId, hId:null, name:'', relationship:'', status:'Adherent', phone:'', age_group:'Adult', gender:'Male', groupId:''};
  UI.modalErrors = {};
  render();
}
async function saveHouseholdModal(){
  const p = UI.modalProps;
  const errs = { name: validateRequired(p.name,'Name'), relationship: validateRequired(p.relationship,'Relationship') };
  UI.modalErrors = errs;
  if(errs.name || errs.relationship){ render(); return; }
  const payload = { owner_member_id:p.memberId, name:p.name.trim(), relationship:p.relationship.trim(), status:p.status, phone:p.phone.trim(), age_group:p.age_group, gender:p.gender };
  await withBusyState(async ()=>{
    if(p.hId){
      const { error } = await sb.from('mis_households').update(payload).eq('id', p.hId);
      if(error){ showToast('Could not save: '+error.message); return; }
    }else{
      const { data, error } = await sb.from('mis_households').insert({...payload, since:String(new Date().getFullYear())}).select().single();
      if(error){ showToast('Could not save: '+error.message); return; }
      if(p.groupId){
        const { error: gErr } = await sb.from('mis_group_members').insert({group_id:p.groupId, person_type:'household', person_id:data.id});
        if(!gErr) await refetch('groupMembers');
      }
    }
    await logAudit(p.hId?'Updated household member':'Added household member', p.name.trim());
    await refetch('households');
    UI.modal=null; render();
    showToast(p.hId?'Household member updated.':'Household member added.');
  });
}

async function callAdminFn(body){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(EDGE_FN_URL, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+session.access_token },
    body: JSON.stringify(body)
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'Request failed.');
  return json;
}

    : {id:null, name:'', role:'Deacon', district_id:(STATE.districts[0]||{}).id, group_id:(STATE.groups[0]||{}).id, status:'Active'};
  UI.modalErrors = {};
  render();

async function saveRoleHolderModal(){
  const p = UI.modalProps;
  const errs = { name: validateRequired(p.name,'Name') };
  UI.modalErrors = errs;
  if(errs.name){ render(); return; }
  const district_id = PASTORAL_DISTRICT_ROLES.includes(p.role) ? p.district_id : null;
  const group_id = GROUP_SCOPED_ROLES.includes(p.role) ? p.group_id : null;
  await withBusyState(async ()=>{
    if(p.id){
      const { error } = await sb.from('mis_role_holders').update({name:p.name.trim(), role:p.role, district_id, group_id, status:p.status}).eq('id', p.id);
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Updated user', p.name.trim()+' ('+p.role+')');
      showToast('User updated.');
    }else{
      const { error } = await sb.from('mis_role_holders').insert({name:p.name.trim(), role:p.role, district_id, group_id, status:p.status});
      if(error){ showToast('Could not save: '+error.message); return; }
      await logAudit('Added user', p.name.trim()+' ('+p.role+')');
      showToast('User added.');
    }
    await refetch('roleHolders');
    UI.modal=null; render();
  });
}
async function confirmRemoveRoleHolder(id){
  const u = STATE.roleHolders.find(x=>x.id===id);
  if(!u) return;
  if(u.user_id===ME.user_id){ showToast("You can't remove the account you're signed in as."); return; }
  if(u.role==='System Administrator' && STATE.roleHolders.filter(x=>x.role==='System Administrator' && x.id!==id).length===0){
    showToast('At least one System Administrator must remain.'); return;
  }
  if(!confirm('Remove '+u.name+' ('+u.role+')? This only removes their access — it does not delete any records.')) return;
  await withBusyState(async ()=>{
    const { error } = await sb.from('mis_role_holders').delete().eq('id', id);
    if(error){ showToast('Could not remove: '+error.message); return; }
    await logAudit('Removed user', u.name+' ('+u.role+')');
    await refetch('roleHolders');
    render();
    showToast('User removed.');
  });
}
function openCreateLoginModal(roleHolderId){
  const u = STATE.roleHolders.find(x=>x.id===roleHolderId);
  UI.modal='createLogin';
  UI.modalProps = {roleHolderId, name:u?u.name:'', username:'', pass1:'', pass2:''};
  UI.modalErrors = {};
  render();
}
async function submitCreateLogin(){
  const p = UI.modalProps;
  const errs = { username: validateRequired(p.username,'Username') };
  if(p.pass1.length<8) errs.pass1 = 'Use at least 8 characters.';
  if(p.pass1!==p.pass2) errs.pass2 = 'Passwords do not match.';
  UI.modalErrors = errs;
  if(Object.keys(errs).length){ render(); return; }
  await withBusyState(async ()=>{
    try{
      await callAdminFn({action:'create_login', role_holder_id:p.roleHolderId, username:p.username.trim(), password:p.pass1});
      await logAudit('Created login', p.name+' ('+p.username.trim()+')');
      await refetch('roleHolders');
      UI.modal=null; render();
      showToast('Login created for '+p.name+'.');
    }catch(e){
      UI.modalErrors = {username: e.message};
      render();
    }
  });
}
function openResetPasswordModal(roleHolderId){
  const u = STATE.roleHolders.find(x=>x.id===roleHolderId);
  UI.modal='resetPassword';

async function submitResetPassword(){
  const p = UI.modalProps;
  const errs = {};
  if(p.pass1.length<8) errs.pass1 = 'Use at least 8 characters.';
  if(p.pass1!==p.pass2) errs.pass2 = 'Passwords do not match.';
  UI.modalErrors = errs;
  if(Object.keys(errs).length){ render(); return; }
  await withBusyState(async ()=>{
    try{
      await callAdminFn({action:'reset_password', user_id:p.userId, new_password:p.pass1});
      await logAudit('Reset password', p.name);
      UI.modal=null; render();
      showToast('Password reset for '+p.name+'.');
    }catch(e){
      UI.modalErrors = {pass1: e.message};
      render();
    }
  });
}
